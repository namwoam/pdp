[tool.poetry]
name = "hw2-report-tools"
version = "0.1.0"
description = "Local tooling for HW2 benchmark data extraction, analysis, and report figures."
authors = ["Team12"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pypdf = "^4.3.1"
pandas = "^2.2.2"
numpy = "^1.26.4"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
