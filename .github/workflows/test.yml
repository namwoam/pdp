name: CI

on:
  pull_request:
    paths:
    - 'hw1/spmv_openmp.c'
    - 'hw2/**'
    - 'hw3/**'
    - '.github/workflows/test.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-hw1:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download testcases
      run: |
        pip install gdown
        gdown 1cF9PeFJQ7UHZaOwxRrlh9i4sewCOWxcB -O testcases.zip
        unzip testcases.zip -d /tmp/tc
        mv /tmp/tc/testcases hw1/testcases_ci
        ls hw1/testcases_ci/

    - name: Build
      run: gcc -fopenmp -O3 -o hw1/spmv_openmp hw1/spmv_openmp.c

    - name: Run tests
      id: test
      run: |
        cd hw1
        {
          echo "## SpMV Test Results"
          echo ""
          echo "| Testcase | Result | Time (ms) |"
          echo "|----------|--------|-----------|"

          pass=0; fail=0
          for mtx in testcases_ci/*.mtx; do
            [ -f "$mtx" ] || continue
            name=$(basename "$mtx" .mtx)
            vec="${mtx%.mtx}.vec"
            vec_arg=""
            [ -f "$vec" ] && vec_arg="$vec"

            output=$(OMP_NUM_THREADS=2 ./spmv_openmp "$mtx" $vec_arg 2>&1)
            time=$(echo "$output" | grep time_ms | sed 's/.*=//')
            if echo "$output" | grep -q "^OK$"; then
              echo "| $name | :white_check_mark: | ${time} |"
              pass=$((pass+1))
            else
              echo "| $name | :x: | ${time} |"
              fail=$((fail+1))
            fi
          done

          echo ""
          echo "**${pass} passed, ${fail} failed**"
        } > /tmp/test_result.md

        cat /tmp/test_result.md

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/test_result.md', 'utf8');
          const marker = '<!-- spmv-test -->';
          const fullBody = marker + '\n' + body;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fullBody,
            });
          }

  runtime-hw1:
    runs-on: ubuntu-latest
    needs: test-hw1
    steps:
    - uses: actions/checkout@v4

    - name: Download testcases
      run: |
        pip install gdown
        gdown 1cF9PeFJQ7UHZaOwxRrlh9i4sewCOWxcB -O testcases.zip
        unzip testcases.zip -d /tmp/tc
        mv /tmp/tc/testcases hw1/testcases_ci
        ls hw1/testcases_ci/

    - name: Build
      run: gcc -fopenmp -O3 -o hw1/spmv_openmp hw1/spmv_openmp.c

    - name: Run runtime benchmark
      id: runtime_hw1
      run: |
        cd hw1
        {
          echo "## HW1 Runtime"
          echo ""
          echo "| Testcase | Median runtime (ms) |"
          echo "|----------|---------------------|"

          for mtx in testcases_ci/*.mtx; do
            [ -f "$mtx" ] || continue
            name=$(basename "$mtx" .mtx)
            vec="${mtx%.mtx}.vec"
            vec_arg=""
            [ -f "$vec" ] && vec_arg="$vec"

            samples=""
            reps=5
            for i in $(seq 1 $reps); do
              output=$(OMP_NUM_THREADS=2 ./spmv_openmp "$mtx" $vec_arg 2>&1)
              time=$(echo "$output" | grep time_ms | sed 's/.*=//')
              samples="${samples}${time}\n"
            done

            median=$(printf "%b" "$samples" | sort -g | sed -n "$(( (reps+1)/2 ))p")
            echo "| ${name} | ${median} |"
          done
        } > /tmp/runtime_hw1_result.md

        cat /tmp/runtime_hw1_result.md

    - name: Comment on PR (hw1 runtime)
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/runtime_hw1_result.md', 'utf8');
          const marker = '<!-- hw1-runtime -->';
          const fullBody = marker + '\n' + body;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fullBody,
            });
          }

  test-hw2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install gdown
        sudo apt-get update
        sudo apt-get install -y openmpi-bin libopenmpi-dev

    - name: Download hw2 testcases
      run: |
        cd hw2
        gdown 1Z1ZsjwO96OkU26kBLe18VtbF0W5DvJbC -O testcases.zip
        unzip -o testcases.zip -d testcases
        rm -f testcases.zip

    - name: Build hw2 binaries
      run: |
        cd hw2
        gcc renderer.c -O3 -lm -o renderer
        mpicc renderer_mpi.c -O3 -lm -march=native -o renderer_mpi

    - name: Run hw2 correctness tests
      id: test_hw2
      run: |
        cd hw2
        set -euo pipefail

        {
          echo "## HW2 Renderer Test Results"
          echo ""
          echo "| Testcase | Serial | MPI |"
          echo "|----------|--------|-----|"

          pass=0
          fail=0

          run_case() {
            name="$1"
            in_file="testcases/testcases/${name}.bin"
            golden="testcases/testcases/golden/${name}.png"

            serial_status=":white_check_mark:"
            mpi_status=":white_check_mark:"

            ./renderer "$in_file" "out_serial_${name}.png" >/tmp/hw2_serial_${name}.log 2>&1 || serial_status=":x:"
            mpirun --oversubscribe -n 4 ./renderer_mpi "$in_file" "out_mpi_${name}.png" >/tmp/hw2_mpi_${name}.log 2>&1 || mpi_status=":x:"

            if [ "$serial_status" = ":white_check_mark:" ] && ! cmp -s "out_serial_${name}.png" "$golden"; then
              serial_status=":x:"
            fi
            if [ "$mpi_status" = ":white_check_mark:" ] && ! cmp -s "out_mpi_${name}.png" "$golden"; then
              mpi_status=":x:"
            fi

            if [ "$serial_status" = ":white_check_mark:" ] && [ "$mpi_status" = ":white_check_mark:" ]; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
            fi

            echo "| ${name} | ${serial_status} | ${mpi_status} |"
          }

          run_case medium_c200000
          run_case imbalance_c100000

          echo ""
          echo "**${pass} passed, ${fail} failed**"
        } > /tmp/test_hw2_result.md

        cat /tmp/test_hw2_result.md

        if grep -q ":x:" /tmp/test_hw2_result.md; then
          exit 1
        fi

    - name: Comment on PR (hw2)
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/test_hw2_result.md', 'utf8');
          const marker = '<!-- hw2-renderer-test -->';
          const fullBody = marker + '\n' + body;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fullBody,
            });
          }

  runtime-hw2:
    runs-on: ubuntu-latest
    needs: test-hw2
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install gdown
        sudo apt-get update
        sudo apt-get install -y openmpi-bin libopenmpi-dev

    - name: Download hw2 testcases
      run: |
        cd hw2
        gdown 1Z1ZsjwO96OkU26kBLe18VtbF0W5DvJbC -O testcases.zip
        unzip -o testcases.zip -d testcases
        rm -f testcases.zip

    - name: Build hw2 binaries
      run: |
        cd hw2
        gcc renderer.c -O3 -lm -o renderer
        mpicc renderer_mpi.c -O3 -lm -march=native -o renderer_mpi

    - name: Run hw2 runtime benchmark
      id: runtime_hw2
      run: |
        cd hw2
        set -euo pipefail

        {
          echo "## HW2 Runtime"
          echo ""
          echo "| Testcase | Serial median (s) | MPI median (s) | Speedup (serial/mpi) |"
          echo "|----------|-------------------|----------------|----------------------|"

          run_bench_case() {
            name="$1"
            in_file="testcases/testcases/${name}.bin"
            reps=3
            serial_samples=""
            mpi_samples=""

            for i in $(seq 1 $reps); do
              serial_log="/tmp/hw2_runtime_serial_${name}_${i}.log"
              mpi_log="/tmp/hw2_runtime_mpi_${name}_${i}.log"

              ./renderer "$in_file" "out_runtime_serial_${name}.png" > /dev/null 2>"$serial_log"
              mpirun --oversubscribe -n 4 ./renderer_mpi "$in_file" "out_runtime_mpi_${name}.png" > /dev/null 2>"$mpi_log"

              serial_time=$(sed -n 's/.*Total render time: \([0-9.]*\) s.*/\1/p' "$serial_log" | tail -n1)
              mpi_time=$(sed -n 's/.*Total wall time (before read -> after write): \([0-9.]*\) s.*/\1/p' "$mpi_log" | tail -n1)

              serial_samples="${serial_samples}${serial_time}\n"
              mpi_samples="${mpi_samples}${mpi_time}\n"
            done

            serial_median=$(printf "%b" "$serial_samples" | sort -g | sed -n "$(( (reps+1)/2 ))p")
            mpi_median=$(printf "%b" "$mpi_samples" | sort -g | sed -n "$(( (reps+1)/2 ))p")
            speedup=$(awk -v s="$serial_median" -v m="$mpi_median" 'BEGIN { if (m > 0) printf "%.2fx", s/m; else print "-" }')

            echo "| ${name} | ${serial_median} | ${mpi_median} | ${speedup} |"
          }

          run_bench_case medium_c200000
          run_bench_case imbalance_c100000
        } > /tmp/runtime_hw2_result.md

        cat /tmp/runtime_hw2_result.md

    - name: Comment on PR (hw2 runtime)
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/runtime_hw2_result.md', 'utf8');
          const marker = '<!-- hw2-runtime -->';
          const fullBody = marker + '\n' + body;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fullBody,
            });
          }

  compile-hw3:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install CUDA toolkit
      uses: Jimver/cuda-toolkit@v0.2.19
      with:
        cuda: '12.4.0'
        method: network
        sub-packages: '["nvcc", "cudart-dev", "cublas-dev"]'

    - name: Compile hw3 kernel
      run: |
        cd hw3
        nvcc -O3 -std=c++14 \
          -gencode=arch=compute_75,code=sm_75 \
          --dryrun \
          main.cu -o main -lcublas 2>&1 | tee /tmp/hw3_compile.log
        echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

    - name: Report compile result
      run: |
        if grep -qi "error" /tmp/hw3_compile.log; then
          echo "::error::hw3 compilation failed"
          cat /tmp/hw3_compile.log
          exit 1
        else
          echo "hw3 compiled successfully (dry run)"
        fi

  test-hw3:
    runs-on: [self-hosted, gpu]
    steps:
    - uses: actions/checkout@v4

    - name: Build hw3
      run: |
        cd hw3
        nvcc -O3 -std=c++14 \
          -gencode=arch=compute_$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d '.'),code=sm_$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d '.') \
          main.cu -o main -lcublas

    - name: Run correctness test
      id: test_hw3
      run: |
        cd hw3
        {
          echo "## HW3 CUDA SGEMM Correctness"
          echo ""

          output=$(./main 1 2>&1)
          echo "\`\`\`"
          echo "$output"
          echo "\`\`\`"

          if echo "$output" | grep -q "verification failed"; then
            echo ""
            echo ":x: **Verification failed**"
          else
            echo ""
            echo ":white_check_mark: **All sizes verified against cuBLAS (tol 1e-2)**"
          fi
        } > /tmp/test_hw3_result.md

        cat /tmp/test_hw3_result.md

        if grep -q "verification failed" /tmp/test_hw3_result.md; then
          exit 1
        fi

    - name: Comment on PR (hw3)
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/test_hw3_result.md', 'utf8');
          const marker = '<!-- hw3-sgemm-test -->';
          const fullBody = marker + '\n' + body;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fullBody,
            });
          }
