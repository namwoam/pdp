name: CI

on:
  pull_request:
    paths:
      - 'hw1/spmv_openmp.c'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download testcases
        run: |
          pip install gdown
          gdown 1cF9PeFJQ7UHZaOwxRrlh9i4sewCOWxcB -O testcases.zip
          unzip testcases.zip -d /tmp/tc
          mv /tmp/tc/testcases hw1/testcases_ci
          ls hw1/testcases_ci/

      - name: Build
        run: gcc -fopenmp -O3 -o hw1/spmv_openmp hw1/spmv_openmp.c

      - name: Run tests
        id: test
        run: |
          cd hw1
          {
            echo "## SpMV Test Results"
            echo ""
            echo "| Testcase | Result | Time (ms) |"
            echo "|----------|--------|-----------|"

            pass=0; fail=0
            for mtx in testcases_ci/*.mtx; do
              [ -f "$mtx" ] || continue
              name=$(basename "$mtx" .mtx)
              vec="${mtx%.mtx}.vec"
              vec_arg=""
              [ -f "$vec" ] && vec_arg="$vec"

              output=$(OMP_NUM_THREADS=2 ./spmv_openmp "$mtx" $vec_arg 2>&1)
              time=$(echo "$output" | grep time_ms | sed 's/.*=//')
              if echo "$output" | grep -q "^OK$"; then
                echo "| $name | :white_check_mark: | ${time} |"
                pass=$((pass+1))
              else
                echo "| $name | :x: | ${time} |"
                fail=$((fail+1))
              fi
            done

            echo ""
            echo "**${pass} passed, ${fail} failed**"
          } > /tmp/test_result.md

          cat /tmp/test_result.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/test_result.md', 'utf8');
            const marker = '<!-- spmv-test -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
