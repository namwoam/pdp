name: SpMV Benchmark

on:
  pull_request:
    paths:
      - 'hw1/spmv_openmp.c'

permissions:
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download testcases
        run: |
          pip install gdown
          gdown 1cF9PeFJQ7UHZaOwxRrlh9i4sewCOWxcB -O testcases.zip
          unzip testcases.zip -d hw1/testcases_bench
          ls hw1/testcases_bench/

      - name: Build serial
        run: gcc -O3 -o hw1/spmv_serial hw1/spmv_serial.c

      - name: Build new openmp
        run: gcc -fopenmp -O3 -o hw1/spmv_openmp_new hw1/spmv_openmp.c

      - name: Build old openmp
        run: |
          git show origin/${{ github.base_ref }}:hw1/spmv_openmp.c > /tmp/spmv_openmp_old.c
          gcc -fopenmp -O3 -o hw1/spmv_openmp_old /tmp/spmv_openmp_old.c

      - name: Run benchmarks
        id: bench
        run: |
          cd hw1

          WARMUP=2
          RUNS=10

          # median helper: sort numbers, pick middle
          median() {
            echo "$@" | tr ' ' '\n' | sort -g | awk 'NR==1{n=0} {a[n++]=$1} END{print a[int(n/2)]}'
          }

          # run binary N times (after warmup), return median time
          bench_one() {
            local bin="$1" mtx="$2" vec_arg="$3"
            # warmup
            for i in $(seq 1 $WARMUP); do
              $bin "$mtx" $vec_arg 2>/dev/null
            done
            # timed runs
            local times=""
            for i in $(seq 1 $RUNS); do
              t=$($bin "$mtx" $vec_arg 2>&1 | grep time_ms | sed 's/.*=//')
              times="$times $t"
            done
            median $times
          }

          {
            echo "## SpMV Benchmark Results"
            echo ""
            echo "_${WARMUP} warmup + ${RUNS} runs, median time_"
            echo ""
            echo "| Testcase | Serial | OpenMP (old) | OpenMP (new) | Speedup (old) | Speedup (new) |"
            echo "|----------|--------|--------------|--------------|---------------|---------------|"

            for mtx in testcases_bench/*.mtx; do
              [ -f "$mtx" ] || continue
              name=$(basename "$mtx" .mtx)
              vec="${mtx%.mtx}.vec"
              vec_arg=""
              [ -f "$vec" ] && vec_arg="$vec"

              serial=$(bench_one ./spmv_serial "$mtx" "$vec_arg")
              serial_ok=$(./spmv_serial "$mtx" $vec_arg 2>&1 | grep -c "^OK$")

              old=$(bench_one "OMP_NUM_THREADS=2 ./spmv_openmp_old" "$mtx" "$vec_arg" || echo "N/A")
              old_ok=$(OMP_NUM_THREADS=2 ./spmv_openmp_old "$mtx" $vec_arg 2>&1 | grep -c "^OK$" || echo "0")

              new=$(bench_one "OMP_NUM_THREADS=2 ./spmv_openmp_new" "$mtx" "$vec_arg")
              new_ok=$(OMP_NUM_THREADS=2 ./spmv_openmp_new "$mtx" $vec_arg 2>&1 | grep -c "^OK$")

              sp_old="N/A"
              sp_new="N/A"
              if [ "$old" != "N/A" ] && [ -n "$old" ] && [ "$(echo "$old > 0" | bc)" = "1" ]; then
                sp_old=$(echo "$serial $old" | awk '{printf "%.1fx", $1/$2}')
              fi
              if [ -n "$new" ] && [ "$(echo "$new > 0" | bc)" = "1" ]; then
                sp_new=$(echo "$serial $new" | awk '{printf "%.1fx", $1/$2}')
              fi

              s_check=""; [ "$serial_ok" = "1" ] && s_check=" :white_check_mark:" || s_check=" :x:"
              o_check=""; [ "$old_ok" = "1" ] && o_check=" :white_check_mark:" || o_check=" :x:"
              n_check=""; [ "$new_ok" = "1" ] && n_check=" :white_check_mark:" || n_check=" :x:"

              echo "| $name | ${serial}ms${s_check} | ${old}ms${o_check} | ${new}ms${n_check} | $sp_old | $sp_new |"
            done

            echo ""
            echo "_Threads: 2 (GitHub Actions runner)_"
          } > /tmp/bench_result.md

          cat /tmp/bench_result.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/bench_result.md', 'utf8');
            const marker = '<!-- spmv-bench -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
